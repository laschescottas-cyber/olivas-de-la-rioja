name: Restaurar insignia NUEVO

on:
  push:
    paths:
      - '.github/workflows/restaurar-insignia-nuevo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar insignia y alinear tarjetas
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Mantener la insignia NUEVO
          css_old = ".card { border: 1px solid var(--oro); background: var(--fondo-card); padding: 20px; text-align: center; border-radius: 4px; transition: 0.3s; }"
          css_new = ".card { position: relative; border: 1px solid var(--oro); background: var(--fondo-card); padding: 20px; text-align: center; border-radius: 4px; transition: 0.3s; }\n        .badge-nuevo { position: absolute; top: 30px; right: 30px; z-index: 3; display: inline-flex; align-items: center; justify-content: center; padding: 7px 13px; border-radius: 999px; background: var(--verde); color: #F5F5DC; border: 2px solid var(--oro); font-family: Arial, sans-serif; font-size: 0.78rem; font-weight: 800; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0,0,0,.45); }"
          if '.badge-nuevo {' not in s:
              s = s.replace(css_old, css_new)

          old = "imagen: producto.Imagen || 'img/placeholder.jpg'\n                };"
          new = "imagen: producto.Imagen || 'img/placeholder.jpg',\n                    nuevo: String(producto.Nuevo || '').trim().toUpperCase() === 'SI'\n                };"
          if 'nuevo: String(producto.Nuevo' not in s:
              s = s.replace(old, new)

          old = "imagen: item.imagen,\n                        variantes: []"
          new = "imagen: item.imagen,\n                        nuevo: item.nuevo,\n                        variantes: []"
          if 'nuevo: item.nuevo' not in s:
              s = s.replace(old, new)

          old = "if (!grupo.imagen || grupo.imagen === 'img/placeholder.jpg') grupo.imagen = item.imagen;\n                grupo.variantes.push(item);"
          new = "if (!grupo.imagen || grupo.imagen === 'img/placeholder.jpg') grupo.imagen = item.imagen;\n                if (item.nuevo) grupo.nuevo = true;\n                grupo.variantes.push(item);"
          if 'if (item.nuevo) grupo.nuevo = true;' not in s:
              s = s.replace(old, new)

          old = "<div class=\"card\">\n                        <img src=\"${escaparHtml(item.imagen)}\" alt=\"${escaparHtml(item.producto)}\">"
          new = "<div class=\"card\">\n                        ${item.nuevo ? '<span class=\"badge-nuevo\">NUEVO</span>' : ''}\n                        <img src=\"${escaparHtml(item.imagen)}\" alt=\"${escaparHtml(item.producto)}\">"
          if 'badge-nuevo\">NUEVO' not in s:
              s = s.replace(old, new)

          # Alinear todas las tarjetas de una misma fila
          s = s.replace(
              ".grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; padding: 40px; max-width: 1200px; margin: auto; }",
              ".grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; padding: 40px; max-width: 1200px; margin: auto; align-items: stretch; }"
          )

          s = s.replace(
              ".card { position: relative; border: 1px solid var(--oro); background: var(--fondo-card); padding: 20px; text-align: center; border-radius: 4px; transition: 0.3s; }",
              ".card { position: relative; height: 100%; display: flex; flex-direction: column; border: 1px solid var(--oro); background: var(--fondo-card); padding: 20px; text-align: center; border-radius: 4px; transition: 0.3s; }"
          )

          if '.card h3 { min-height: 56px;' not in s:
              anchor = ".card img { width: 100%; height: 280px; object-fit: contain; background: #111; border: 1px solid var(--oro); margin-bottom: 20px; }"
              extra = anchor + "\n        .card h3 { min-height: 56px; margin: 0 0 8px; display: flex; align-items: center; justify-content: center; }\n        .campo-producto { min-height: 84px; text-align: left; margin: 12px 0; font-family: Arial, sans-serif; color: #F5F5DC; }\n        .card > h3 + p { min-height: 84px; margin: 12px 0; display: flex; align-items: center; justify-content: center; }\n        .card > button[data-agregar] { margin-top: auto; }"
              s = s.replace(anchor, extra)
              s = s.replace("        .campo-producto { text-align: left; margin: 12px 0; font-family: Arial, sans-serif; color: #F5F5DC; }\n", "")

          p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Alinear tarjetas del catálogo"
            git push
          fi
